version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scouts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-scouts_cc}
      POSTGRES_USER: ${DB_USER:-scouts_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scouts_pass}
    volumes:
      - scouts_postgres_data:/var/lib/postgresql/data
    networks:
      - scouts_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scouts_user} -d ${DB_NAME:-scouts_cc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scouts_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-scouts_cc}
      DB_USER: ${DB_USER:-scouts_user}
      DB_PASSWORD: ${DB_PASSWORD:-scouts_pass}
      PORT: 3000
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    ports:
      - "3002:3000"
    volumes:
      - scouts_uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scouts_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scouts_frontend
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - backend
    networks:
      - scouts_network

volumes:
  scouts_postgres_data:
  scouts_uploads_data:

networks:
  scouts_network:
    driver: bridge
