name: TEMP - Renombrar proyecto a Desarrollo Scout

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Renombrar proyecto
        run: |
          source .github/scripts/gh-project-lib.sh
          OLD_TITLE="Scouts CC - Scrum Board"
          OLD_ID="$(gh api graphql -f query='query{ user(login:"'"$GITHUB_REPOSITORY_OWNER"'"){ projectsV2(first:50){ nodes{ id title } } } }' \
            -q '.data.user.projectsV2.nodes[]? | select(.title=="'"$OLD_TITLE"'") | .id' | head -1 || true)"
          if [ -z "$OLD_ID" ]; then
            echo "Proyecto '$OLD_TITLE' no encontrado; no hay nada que renombrar."
          else
            gh api graphql -F pid="$OLD_ID" -F t="$PROJECT_TITLE" \
              -f query='mutation($pid:ID!,$t:String!){ updateProjectV2(input:{projectId:$pid,title:$t}){ projectV2{ id title } } }'
            echo "Renombrado '$OLD_TITLE' -> '$PROJECT_TITLE'."
          fi
