name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin Raspberry Pi host key
        run: |
          mkdir -p ~/.ssh
          echo "raspberrypi.tail6ac242.ts.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINLFHwjVkPyF2gZ30F4gZiKAdx3QgKgHrWaV9Q+9Q5uT" >> ~/.ssh/known_hosts

      - name: Sync code to Raspberry Pi
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='backend/node_modules' \
            --exclude='frontend/dist' \
            --exclude='backend/dist' \
            --exclude='uploads' \
            --exclude='.env' \
            ./ rasp@raspberrypi.tail6ac242.ts.net:~/scouts-app/

      - name: Write production .env
        run: |
          ssh rasp@raspberrypi.tail6ac242.ts.net "cat > ~/scouts-app/.env" <<EOF
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          PORT=3000
          NODE_ENV=production
          UPLOAD_DIR=/app/uploads
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_GROUP_CHAT_ID=${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          EOF

      - name: Build and deploy with Docker Compose
        run: |
          ssh rasp@raspberrypi.tail6ac242.ts.net "cd ~/scouts-app && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"

      - name: Smoke check
        run: |
          ssh rasp@raspberrypi.tail6ac242.ts.net '
            for i in $(seq 1 15); do
              curl -sf --max-time 5 http://localhost:8091 >/dev/null && \
              curl -sf --max-time 5 http://localhost:3002/api >/dev/null && \
              echo "scouts-app is up" && exit 0
              echo "waiting for scouts-app to respond ($i/15)..."
              sleep 4
            done
            echo "scouts-app did not respond in time" >&2
            exit 1
          '
