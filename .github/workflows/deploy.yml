name: Deploy a Raspberry

# Igual que servidor-coronas: las imágenes linux/arm64 se construyen en la Mac
# (runner propio) y se mandan por SSH a la Raspberry, que solo las arranca.
# Solo se dispara con push a main: el repo es público y un runner propio nunca
# debe ejecutar código de pull requests ni de forks.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "specs/**"
      - "mcp-server/**"
  workflow_dispatch:

concurrency:
  group: deploy-raspberry-scouts
  cancel-in-progress: false

env:
  # Se pueden cambiar en Settings > Secrets and variables > Actions > Variables
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'raspberrypi.local' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'rasp' }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/rasp/scouts-app' }}

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, scouts]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PATH de Docker
        run: echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verificar Docker
        run: docker info --format '{{.ServerVersion}}'

      - name: Construir imágenes linux/arm64
        run: |
          SHA=${GITHUB_SHA::7}
          docker buildx build --platform linux/arm64 --tag "scouts-app-backend:$SHA" --load ./backend
          docker buildx build --platform linux/arm64 --tag "scouts-app-frontend:$SHA" --load ./frontend

      - name: Verificar acceso SSH a la Raspberry
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'echo conectado a $(hostname)'

      - name: Enviar imágenes y docker-compose a la Raspberry
        run: |
          SHA=${GITHUB_SHA::7}
          docker save "scouts-app-backend:$SHA" "scouts-app-frontend:$SHA" | gzip \
            | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'gunzip | docker load'
          scp -o BatchMode=yes docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.prod.yml"

      - name: Reiniciar backend y frontend en la Raspberry
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "SHA=${GITHUB_SHA::7} DEPLOY_DIR=$DEPLOY_DIR bash -s" <<'REMOTE'
          set -eu
          for img in scouts-app-backend scouts-app-frontend; do
            # Guardar la imagen actual para poder volver atrás
            if docker image inspect "$img:latest" >/dev/null 2>&1; then
              docker tag "$img:latest" "$img:previous"
            fi
            docker tag "$img:$SHA" "$img:latest"
          done
          cd "$DEPLOY_DIR"
          # Solo la app: no se toca Postgres ni el .env de la Raspberry
          docker compose -f docker-compose.prod.yml up -d --no-build --no-deps backend frontend
          REMOTE

      - name: Esperar a que la app responda
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          for i in $(seq 1 40); do
            api=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3002/api/auth/login -H 'Content-Type: application/json' -d '{}' || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8091 || true)
            if { [ "$api" = "400" ] || [ "$api" = "401" ]; } && [ "$web" = "200" ]; then
              echo "Scouts arriba (intento $i)"
              exit 0
            fi
            sleep 3
          done
          echo "La app no respondió. Últimos logs:"
          docker logs --tail 40 scouts_backend
          exit 1
          REMOTE

      - name: Limpiar imágenes viejas
        if: success()
        run: |
          docker image prune -f >/dev/null
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'docker image prune -f >/dev/null'
