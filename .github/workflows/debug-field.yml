name: DEBUG - Probar createProjectV2Field

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Probar mutaciones en proyecto temporal
        run: |
          set -euo pipefail
          source .github/scripts/gh-project-lib.sh
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.repository }}"

          OWNER_NODE_ID="$(gh_owner_id)"
          TMP_ID="$(gh_graphql \
            -f query='mutation($oid:ID!,$title:String!){ createProjectV2(input:{ownerId:$oid,title:$title}){ projectV2{ id } } }' \
            -F oid="$OWNER_NODE_ID" -F title="DEBUG - Temp Field Test" \
            -q '.data.createProjectV2.projectV2.id')"
          echo "TMP_PROJECT=$TMP_ID"

          echo "--- A) seleccion directa projectV2Field{ id } (esperado: error union) ---"
          gh api graphql \
            -f query='mutation($pid:ID!,$name:String!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ createProjectV2Field(input:{projectId:$pid,dataType:SINGLE_SELECT,name:$name,singleSelectOptions:$opts}){ projectV2Field{ id } } }' \
            -F pid="$TMP_ID" -F name="StatusA" -F opts="$(jq -nc '[{name:"Done", color:"GREEN", description:""}]')" 2>&1 | tail -3 || true

          echo "--- B) fragmento inline ... on ProjectV2SingleSelectField (esperado: ok) ---"
          gh api graphql \
            -f query='mutation($pid:ID!,$name:String!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ createProjectV2Field(input:{projectId:$pid,dataType:SINGLE_SELECT,name:$name,singleSelectOptions:$opts}){ projectV2Field{ ... on ProjectV2SingleSelectField { id } } } }' \
            -F pid="$TMP_ID" -F name="StatusB" -F opts="$(jq -nc '[{name:"Done", color:"GREEN", description:""}]')" 2>&1 | tail -3 || true

          echo "--- C) updateProjectV2Field con fragmento inline ---"
          gh api graphql \
            -f query='mutation($pid:ID!,$name:String!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ createProjectV2Field(input:{projectId:$pid,dataType:SINGLE_SELECT,name:$name,singleSelectOptions:$opts}){ projectV2Field{ ... on ProjectV2SingleSelectField { id } } } }' \
            -F pid="$TMP_ID" -F name="SprintB" -F opts="$(jq -nc '[{name:"Sprint 1", color:"BLUE", description:""}]')" \
            -q '.data.createProjectV2Field.projectV2Field.id' > /tmp/sprint_field_id
          SPRINT_FIELD_ID="$(cat /tmp/sprint_field_id)"
          echo "SPRINT_FIELD_ID=$SPRINT_FIELD_ID"
          gh api graphql \
            -f query='mutation($fid:ID!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ updateProjectV2Field(input:{fieldId:$fid, singleSelectOptions:$opts}){ projectV2Field{ ... on ProjectV2SingleSelectField { id } } } }' \
            -F fid="$SPRINT_FIELD_ID" -F opts='[{name:"Sprint 1", color:"BLUE", description:""},{name:"Sprint 2", color:"BLUE", description:""}]' 2>&1 | tail -2 || true

          echo "--- D) limpiar proyecto temporal ---"
          gh_graphql \
            -f query='mutation($id:ID!){ deleteProjectV2(input:{projectId:$id}){ projectV2{ id } } }' \
            -F id="$TMP_ID" >/dev/null
          echo "proyecto temporal eliminado"
