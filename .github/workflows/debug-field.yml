name: DEBUG - Probar createProjectV2Field

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Probar mutaciones en proyecto temporal
        run: |
          set -euo pipefail
          source .github/scripts/gh-project-lib.sh
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.repository }}"

          OWNER_NODE_ID="$(gh_owner_id)"
          TMP_ID="$(gh_graphql \
            -f query='mutation($oid:ID!,$title:String!){ createProjectV2(input:{ownerId:$oid,title:$title}){ projectV2{ id } } }' \
            -F oid="$OWNER_NODE_ID" -F title="DEBUG - Temp Field Test" \
            -q '.data.createProjectV2.projectV2.id')"
          echo "TMP_PROJECT=$TMP_ID"

          echo "--- A) seleccion directa projectV2Field{ id } (esperado: error union) ---"
          gh api graphql \
            -f query='mutation($pid:ID!,$name:String!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ createProjectV2Field(input:{projectId:$pid,dataType:SINGLE_SELECT,name:$name,singleSelectOptions:$opts}){ projectV2Field{ id } } }' \
            -F pid="$TMP_ID" -F name="StatusA" -F opts="$(jq -nc '[{name:"Done", color:"GREEN", description:""}]')" 2>&1 | tail -2 || true

          echo "--- B) --input - + fragmento inline (esperado: ok) ---"
          BODY="$(jq -nc \
            --arg pid "$TMP_ID" \
            --argjson opts "$(jq -nc '[{name:"Done", color:"GREEN", description:""}]')" \
            '{query:"mutation($pid:ID!,$name:String!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ createProjectV2Field(input:{projectId:$pid,dataType:SINGLE_SELECT,name:$name,singleSelectOptions:$opts}){ projectV2Field{ ... on ProjectV2SingleSelectField { id } } } }", variables:{pid:$pid, name:"StatusB", opts:$opts}}')"
          printf '%s' "$BODY" | gh api graphql --input - 2>&1 | tail -2 || true

          echo "--- C) updateProjectV2Field con --input - (esperado: ok) ---"
          BODY="$(jq -nc \
            --arg pid "$TMP_ID" \
            --argjson opts "$(jq -nc '[{name:"Sprint 1", color:"BLUE", description:""}]')" \
            '{query:"mutation($pid:ID!,$name:String!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ createProjectV2Field(input:{projectId:$pid,dataType:SINGLE_SELECT,name:$name,singleSelectOptions:$opts}){ projectV2Field{ ... on ProjectV2SingleSelectField { id } } } }", variables:{pid:$pid, name:"SprintB", opts:$opts}}')"
          SPRINT_FIELD_ID="$(printf '%s' "$BODY" | gh api graphql --input - -q '.data.createProjectV2Field.projectV2Field.id')"
          echo "SPRINT_FIELD_ID=$SPRINT_FIELD_ID"
          BODY="$(jq -nc \
            --arg fid "$SPRINT_FIELD_ID" \
            --argjson opts "$(jq -nc '[{name:"Sprint 1", color:"BLUE", description:""},{name:"Sprint 2", color:"BLUE", description:""}]')" \
            '{query:"mutation($fid:ID!,$opts:[ProjectV2SingleSelectFieldOptionInput!]!){ updateProjectV2Field(input:{fieldId:$fid, singleSelectOptions:$opts}){ projectV2Field{ ... on ProjectV2SingleSelectField { id } } } }", variables:{fid:$fid, opts:$opts}}')"
          printf '%s' "$BODY" | gh api graphql --input - 2>&1 | tail -2 || true

          echo "--- D) limpiar proyecto temporal ---"
          gh_graphql \
            -f query='mutation($id:ID!){ deleteProjectV2(input:{projectId:$id}){ projectV2{ id } } }' \
            -F id="$TMP_ID" >/dev/null
          echo "proyecto temporal eliminado"
