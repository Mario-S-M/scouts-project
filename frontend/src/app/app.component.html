<!-- El tema de la sección vive en <body> (clase + colores de la API), no aquí -->
<div class="app-container">

  <!-- Navbar: marca · pestañas con ícono · avatar. En celular las pestañas bajan a una barra fija -->
  <header *ngIf="!isLoginPage" class="scout-nav">
    <a routerLink="/" class="nav-brand">
      <img [src]="logoNav" alt="Logo" class="nav-logo-img" />
      <span class="nav-logo-text">
        <span class="nav-title">Grupo 7 · Itsï Tarhiata</span>
        <span class="nav-subtitle">{{ subtituloNav }}</span>
      </span>
    </a>

    <nav class="nav-tabs" aria-label="Navegación principal">
      <ng-container *ngFor="let it of menuItems">
        <a *ngIf="!it.items" class="nav-tab" [class.activo]="it.styleClass === 'nav-activo'"
           [routerLink]="it.routerLink" [attr.aria-label]="it.label">
          <i [class]="it.icon"></i>
          <span class="nav-tab-label">{{ etiquetaCorta(it) }}</span>
        </a>
        <button *ngIf="it.items" type="button" class="nav-tab" [class.activo]="it.styleClass === 'nav-activo'"
                [class.abierto]="submenuAbierto === it.label" [attr.aria-label]="it.label" aria-haspopup="menu"
                (click)="abrirSubmenu($event, it, submenu)">
          <i [class]="it.icon"></i>
          <span class="nav-tab-label">{{ etiquetaCorta(it) }}</span>
        </button>
      </ng-container>
    </nav>

    <ng-container *ngIf="authService.user$ | async as user">
      <button type="button" class="nav-avatar" (click)="revisarTelegram(); panelUsuario.toggle($event)" aria-label="Mi cuenta"
              [pTooltip]="user.nombre" tooltipPosition="left">
        {{ user.nombre[0] }}
      </button>

      <p-overlayPanel #panelUsuario styleClass="scout-popup panel-usuario" appendTo="body">
        <div class="panel-usuario-cabecera">
          <div class="nav-avatar grande">{{ user.nombre[0] }}</div>
          <div>
            <div class="panel-usuario-nombre">{{ user.nombre }}</div>
            <div class="panel-usuario-rol">{{ authService.getRolLabel(user.rol) }}</div>
          </div>
        </div>
        <ng-container *ngIf="user.rol !== 'scout'">
          <button type="button" class="panel-usuario-opcion" *ngIf="telegramVinculado === false"
                  (click)="vincularTelegram()" [disabled]="vinculandoTelegram">
            <i class="pi pi-send"></i> {{ vinculandoTelegram ? 'Abriendo Telegram…' : 'Vincular Telegram' }}
          </button>
          <div class="panel-usuario-opcion estado" *ngIf="telegramVinculado === true">
            <i class="pi pi-check-circle"></i> Telegram vinculado
          </div>
        </ng-container>
        <button type="button" class="panel-usuario-opcion" (click)="toggleTheme()">
          <i [class]="getThemeIcon()"></i> {{ getThemeIcon().includes('sun') ? 'Tema claro' : 'Tema oscuro' }}
        </button>
        <button type="button" class="panel-usuario-opcion salir" (click)="panelUsuario.hide(); logout()">
          <i class="pi pi-sign-out"></i> Cerrar sesión
        </button>
      </p-overlayPanel>
    </ng-container>
  </header>

  <p-tieredMenu #submenu [model]="submenuItems" [popup]="true" appendTo="body" styleClass="scout-popup"
                (onHide)="submenuAbierto = null"></p-tieredMenu>

  <!-- Main Content -->
  <div [class]="isLoginPage ? '' : 'main-content'">
    <router-outlet></router-outlet>
  </div>

  <!-- Footer -->
  <div *ngIf="!isLoginPage" class="footer-bar">
    Grupo Scout 7 · Itsï Tarhiata — Scouts México &copy; {{ currentYear }}
  </div>

</div>

<p-toast position="top-right"></p-toast>
