<main class="login-wrapper">
  <section class="login-card" aria-labelledby="login-title">

    <header class="login-header">
      <img
        src="assets/images/logo-grupo-160.png"
        width="160"
        height="160"
        alt="Grupo Scout 7 Itsï Tarhiata"
        class="login-logo"
      />
      <h1 id="login-title" class="login-title">Grupo Scout 7 · Itsï Tarhiata</h1>
      <p class="login-subtitle">Scouts México</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-envelope" aria-hidden="true"></i>
          <input
            #emailInput
            id="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            pInputText
            class="w-full"
            placeholder="nombre@scouts.mx"
            formControlName="email"
            (blur)="normalizarCorreo()"
            [attr.aria-invalid]="!!fieldError('email')"
            [attr.aria-describedby]="fieldError('email') ? 'email-error' : null"
          />
        </span>
        <small id="email-error" class="field-error" *ngIf="fieldError('email') as error">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
          {{ error }}
        </small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <span class="p-input-icon-left w-full password-wrap">
          <i class="pi pi-lock" aria-hidden="true"></i>
          <input
            #passwordInput
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            pInputText
            class="w-full"
            formControlName="password"
            [attr.aria-invalid]="!!fieldError('password')"
            [attr.aria-describedby]="fieldError('password') ? 'password-error' : null"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            [attr.aria-pressed]="showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i class="pi" [class.pi-eye]="!showPassword" [class.pi-eye-slash]="showPassword" aria-hidden="true"></i>
          </button>
        </span>
        <small id="password-error" class="field-error" *ngIf="fieldError('password') as error">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
          {{ error }}
        </small>
      </div>

      <!-- Solo visual: el anuncio lo hace la región aria-live de abajo -->
      <p class="server-error" [class.visible]="!!errorMsg">
        <ng-container *ngIf="errorMsg">
          <i class="pi pi-info-circle" aria-hidden="true"></i>
          {{ errorMsg }}
        </ng-container>
      </p>

      <button type="submit" class="login-btn" [disabled]="bloqueado">
        <ng-container *ngIf="segundosEspera > 0; else normal">Espera {{ segundosEspera }} s</ng-container>
        <ng-template #normal>
          <i class="pi" [class.pi-spin]="loading" [class.pi-spinner]="loading" [class.pi-sign-in]="!loading" aria-hidden="true"></i>
          {{ loading ? 'Entrando…' : 'Iniciar sesión' }}
        </ng-template>
      </button>

      <div class="sr-only" aria-live="polite" aria-atomic="true">{{ liveMsg }}</div>
    </form>

    <footer class="login-footer">
      Scouts México &copy; {{ year }}
    </footer>
  </section>
</main>
