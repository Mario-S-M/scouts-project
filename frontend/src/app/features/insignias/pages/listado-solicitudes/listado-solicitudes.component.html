<app-page-header
  title="Solicitudes de Insignias"
  subtitle="Pedidos de material por caminante, listos para imprimir">
</app-page-header>

<div class="page-container">

  <div class="flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <span class="text-500 text-sm">
      {{ solicitudes.length }} solicitud(es) registrada(s)
    </span>
    <button pButton icon="pi pi-plus" label="Nueva solicitud"
            class="p-button-sm" (click)="nueva()">
    </button>
  </div>

  <!-- Cargando -->
  <div *ngIf="cargando" class="flex justify-content-center py-5">
    <p-progressSpinner strokeWidth="4" styleClass="w-3rem h-3rem"></p-progressSpinner>
  </div>

  <!-- Sin solicitudes -->
  <div *ngIf="!cargando && solicitudes.length === 0" class="empty-state text-center py-5">
    <i class="pi pi-inbox text-4xl text-300 mb-3 block"></i>
    <p class="text-600">Todavía no hay solicitudes de insignias registradas.</p>
    <button pButton label="Crear la primera solicitud" icon="pi pi-plus"
            class="p-button-outlined p-button-sm mt-2" (click)="nueva()">
    </button>
  </div>

  <!-- Tabla -->
  <p-table *ngIf="!cargando && solicitudes.length > 0"
           [value]="solicitudes"
           [paginator]="solicitudes.length > 10" [rows]="10"
           styleClass="p-datatable-sm p-datatable-striped"
           responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Caminante</th>
        <th style="width:130px">Fecha</th>
        <th style="width:140px">Sección</th>
        <th style="width:90px; text-align:center">Ítems</th>
        <th style="width:140px; text-align:center">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-sol>
      <tr>
        <td><span class="font-bold">{{ nombreCaminante(sol) }}</span></td>
        <td>{{ sol.fecha | date:'dd/MM/yyyy' }}</td>
        <td>{{ sol.seccion | titlecase }}</td>
        <td class="text-center">{{ numeroItems(sol) }}</td>
        <td class="text-center">
          <div class="flex gap-1 justify-content-center">
            <button pButton
                    [icon]="descargando === sol.id ? 'pi pi-spin pi-spinner' : 'pi pi-file-pdf'"
                    class="p-button-text p-button-sm p-button-rounded p-button-danger"
                    pTooltip="Ver / descargar PDF"
                    [disabled]="descargando === sol.id"
                    (click)="descargarPdf(sol)">
            </button>
            <button pButton icon="pi pi-pencil"
                    class="p-button-text p-button-sm p-button-rounded"
                    pTooltip="Editar" (click)="editar(sol)">
            </button>
            <button pButton icon="pi pi-trash"
                    class="p-button-text p-button-sm p-button-rounded p-button-danger"
                    pTooltip="Eliminar" (click)="confirmarEliminar(sol)">
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

</div>

<!-- ConfirmationService se provee en InsigniasModule, así que el diálogo vive aquí -->
<p-confirmDialog></p-confirmDialog>
